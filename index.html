<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDoom</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        /* Fill viewport while maintaining aspect ratio (letterbox/pillarbox) */
        max-width: 100%;
        max-height: 100%;
        /* Center in viewport */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: crosshair;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #b00;
        font-family: monospace;
        font-size: 24px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading DOOM1.WAD...</div>
    <canvas id="doom"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
